[main]
font=JetBrainsMono Nerd Font:weight=bold:size=14
dpi-aware=no
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic
password-character=*
fuzzy=yes

# --- LAYOUT ---
width=45
lines=10
horizontal-pad=20
vertical-pad=20
inner-pad=10
line-height=24
letter-spacing=0

# --- BEHAVIOR ---
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Background: Waybar Dark Glass (1E2328 at 80% opacity)
background=1E2328CC

# Text: Waybar Default Sage Green
text=90AB8BFF

# Match: Cream (to make searched letters pop)
match=EBF4DDFF

# Selection: Waybar Hover (Dark Sage Background)
selection=5A7863FF

# Selection Text: Waybar Hover Text (White)
selection-text=FFFFFFFF

# Selection Match: Cream
selection-match=EBF4DDFF

# Border: Sage Green
border=90AB8BFF

[border]
width=2
radius=12
